<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>Head office dashboard | GTM</title>
  <link rel="icon" href="/schemes/img/gtm-logo.png" type="image/png">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- Head office sign-in: the password is used for both dashboards, and is kept only in this page's memory -->
  <main id="login-view" class="login">
    <header class="bar"><span class="org">Green Tamil Nadu Mission</span></header>
    <section class="panel-login">
      <h1>Head office dashboard</h1>
      <p class="lede">Sign in with the head office login ID and password. You'll see the overall department and scheme details.</p>
      <form id="login-form" novalidate>
        <label for="login-id">Login ID</label>
        <input id="login-id" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button type="submit" id="login-submit">Sign in</button>
      </form>
    </section>
  </main>

  <!-- Side menu and dashboards -->
  <div id="app-view" class="app" hidden>
    <aside class="side">
      <p class="side-org">Green Tamil Nadu Mission</p>
      <p class="side-title">Head office</p>
      <nav aria-label="Dashboards">
        <div class="nav-group">
          <button type="button" class="nav" data-section="dept" aria-pressed="false">Departments</button>
          <ul class="sub" id="sub-dept" aria-label="Departments"></ul>
        </div>
        <div class="nav-group">
          <button type="button" class="nav" data-section="scheme" aria-pressed="false">Schemes</button>
          <ul class="sub" id="sub-scheme" aria-label="Schemes"></ul>
        </div>
      </nav>
      <button type="button" id="sign-out" class="signout">Sign out</button>
    </aside>
    <div class="stage">
      <iframe id="frame-dept" class="frame" title="Departments dashboard" hidden></iframe>
      <iframe id="frame-scheme" class="frame" title="Schemes dashboard" hidden></iframe>
    </div>
  </div>

  <div id="busy" class="busy" role="status" aria-live="polite" hidden>
    <p id="busy-text">Opening the dashboard…</p>
  </div>

  <script src="admin.js" defer></script>
</body>
</html>
